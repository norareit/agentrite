# Base runtime configuration for the agent sandbox, shared by every project that vendors
# this kit. Every confinement setting lives here. container/entrypoint.sh is the one
# exception and holds only the start-up firewall, because iptables rules are kernel state
# in a network namespace that does not exist until the container runs. container/sandbox.sh
# is a wrapper that adds only the per-run working directory, which for a unit run is a
# clone of the unit's branch with the host's .reviews and .orchestrator mounted in it,
# any extra mounts, the directories of the host that hold the harnesses' logs, the bell of
# the harnesses when the project's agentrite.json holds "bell": true, the harnesses the
# image is built with and their versions, the hosts the harnesses need, what each
# harness is given besides from its module, and the build of the project's own
# Dockerfile on the image this file builds; it sets nothing that confines the container.
#
# A project layers its own compose file over this one, at sandbox/compose.project.yml,
# holding what varies per project: the Compose project name, the image name, the egress
# allowlist, the resource limits and, if it has browser tests, the Playwright version.
# container/sandbox.sh passes both files to Compose, with --project-directory set to the
# project root, so every relative path in either file resolves from there. A project that
# needs more software in the image adds a sandbox/Dockerfile, which container/sandbox.sh
# builds on the image of this file, outside Compose.

services:
  sandbox:
    build:
      # The context is the project root rather than this directory: the Dockerfile
      # copies the kit's entrypoint from under it and, for a project with Playwright,
      # installs the project's own dependencies in order to get Playwright's system
      # libraries at the version the project resolved, so it needs the project's
      # package.json and package-lock.json in the context.
      context: .
      # The kit's container directory relative to the project root, which
      # container/sandbox.sh works out from where the kit is installed.
      dockerfile: ${AGENTRITE_CONTAINER:?run the sandbox through the project's sandbox.sh}/Dockerfile
      args:
        KIT_CONTAINER: ${AGENTRITE_CONTAINER}
        AGENT_UID: ${AGENT_UID:-1000}
        AGENT_GID: ${AGENT_GID:-1000}
        # The harnesses of the project, which container/sandbox.sh works out at each start
        # from their modules and from the project's agentrite.json: their packages at the
        # wanted versions, the record of the harnesses and versions the image holds, and
        # the directories of their logs. A version is the one the project's compose file
        # gives under the harness's own build argument, or else the one the host has, or
        # else the latest published when the image is built. These three are the kit's to
        # set, and the wrapper refuses a project's file that sets one.
        HARNESS_PACKAGES: ${SANDBOX_HARNESS_PACKAGES:?run the sandbox through the project's sandbox.sh}
        HARNESS_RECORD: ${SANDBOX_HARNESS_RECORD:?run the sandbox through the project's sandbox.sh}
        HARNESS_DIRECTORIES: ${SANDBOX_HARNESS_DIRECTORIES:?run the sandbox through the project's sandbox.sh}
        # The version of the installed kit, which the image records, so that
        # container/sandbox.sh builds it again for another.
        AGENTRITE_VERSION: ${SANDBOX_AGENTRITE_VERSION:?run the sandbox through the project's sandbox.sh}
    working_dir: /work
    init: true
    stdin_open: true
    tty: true
    # Chromium renders into shared memory; Docker's default 64M /dev/shm makes the
    # visual tests flake with "Target closed". 1G matches Playwright's guidance.
    shm_size: 1gb

    # The root filesystem is read-only. The agent can write only the mounted working
    # directory, its home volume, the directories of the host that container/sandbox.sh
    # mounts in that home for the harnesses' logs, and the /tmp and /dev/shm scratch
    # tmpfs (/dev/shm is sized by shm_size above). /run is a tmpfs too but stays
    # root-owned.
    #
    # Docker mounts a tmpfs noexec unless told otherwise. /tmp is given exec because test
    # suites and tools run what they write to the temporary directory, and because the
    # agent can already run what it writes to /work and to its home, so noexec there
    # confined nothing. /tmp keeps nosuid and nodev.
    read_only: true
    tmpfs:
      - /tmp:exec
      - /run

    # Every capability dropped except NET_ADMIN, which the entrypoint needs to install
    # the firewall, SETUID/SETGID, which it needs to drop from root to the agent user
    # afterwards, and KILL. Docker's init runs as root and forwards a signal the
    # container receives, a resize of the terminal among them, to the command, which
    # runs as the agent. Without KILL the kernel refuses that and the init exits, which
    # stops the container. The agent process ends up with an empty capability set, and
    # no-new-privileges leaves it no way to regain one.
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - SETUID
      - SETGID
      - KILL
    security_opt:
      - no-new-privileges:true

    pids_limit: 4096

    # host.docker.internal resolves to the host on Linux only with this line.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      # The hostnames reachable over HTTPS on port 443, with everything else denied, are
      # this KIT_ALLOWLIST together with the ALLOWLIST the project's compose file
      # supplies, which may be empty or left out. Entries are hostnames only; the
      # entrypoint refuses an address or a CIDR range. The hosts the kit itself needs
      # are here, so that a kit release that needs another adds it without a change to
      # any project, and a project's list holds only what the project needs besides,
      # which is what varies most between them. The kit's own host is written here, and
      # the hosts of the project's harnesses follow it, each after a comment that says
      # why, as container/sandbox.sh composes them from the harnesses' modules. They are
      # the kit's to set, and the wrapper refuses a project's file that sets this list.
      KIT_ALLOWLIST: |
        # FIREWALL_PROBE below, and the npm registry: npm ci inside the container
        registry.npmjs.org
        ${SANDBOX_HARNESS_ALLOWLIST:?run the sandbox through the project's sandbox.sh}
      #
      # The local model server on the host, reached through the Docker gateway. Its
      # port is admitted only when modelServer in the project's agentrite.json holds
      # true, and then only this host and port, nothing else on the host. Whether it is
      # admitted is the kit's to set: the wrapper gives it from that file at each start.
      MODEL_SERVER_HOST: host.docker.internal
      MODEL_SERVER_PORT: "11434"
      MODEL_SERVER_ADMITTED: ${SANDBOX_MODEL_SERVER_ADMITTED:?run the sandbox through the project's sandbox.sh}
      # The start-up self-check: this host must be blocked, that one must be reachable.
      FIREWALL_CANARY: example.com
      FIREWALL_PROBE: registry.npmjs.org
      # Git's ownership check, switched off for every process in the container. Git
      # refuses a repository whose top directory another user owns unless
      # safe.directory names it, and Docker Desktop for macOS shows the root of every
      # bind mount as owned by root, 0:0, while everything inside it keeps the host
      # user's uid, which is the agent's. Git would therefore refuse /work and every
      # `sandbox.sh --mount` path. The check guards a user against a repository that
      # someone else controls, whose configuration could run commands. It protects
      # nothing here: the only user that writes to a mounted repository is the agent,
      # which can already change that repository's .git/config, and the mounts are the
      # developer's own. "*" covers /work and every mount without the wrapper having to
      # list them. It is set through the environment because git honors safe.directory
      # only in protected configuration, which this is, and neither config file will
      # do: /etc/gitconfig is the developer's own, mounted below, and the agent's
      # ~/.gitconfig lives in the home volume, which a new volume starts without.
      #
      # Git's hooks directory, set to one of the image's, which container/sandbox.sh
      # names: for a project with the process the one that holds the kit's commit-msg
      # hook, which refuses a commit message with a trailer the standards forbid, and for
      # a sandbox-only project the empty one, which holds no hook. The directory is the
      # image's and not the clone's, which the agent can write, .git included, and it is
      # set here for the same reason as safe.directory: the environment outranks both
      # config files, and belongs to the kit. It replaces the hooks of a mounted
      # repository, and of a hooks directory that its configuration names, so that those
      # are not run in the container, with either directory.
      #
      # These are the two entries of git's environment configuration. A project that sets
      # GIT_CONFIG_COUNT itself overrides both.
      GIT_CONFIG_COUNT: "2"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: "*"
      GIT_CONFIG_KEY_1: core.hooksPath
      GIT_CONFIG_VALUE_1: ${SANDBOX_GIT_HOOKS_PATH:?run the sandbox through the project's sandbox.sh}

    volumes:
      # Nothing is declared at /work. container/sandbox.sh passes the mount at /work for
      # every run, as a `docker compose run --volume`: the clone of a unit run, with the
      # host's .reviews at /work/.reviews and its .orchestrator at /work/.orchestrator,
      # or the project root with --in-place, or the directory of --workdir. It adds
      # extra mounts the same way. A Compose older than 2.35.0 mounts a volume this file
      # declares at a target in place of a run's --volume to the same target, so a
      # volume here at /work would have every unit run work in the project root rather
      # than in its clone.
      #
      # The agent's home, which survives a container. Holds the harnesses' logins and
      # settings, such as Claude Code's, whatever else a harness keeps there and the npm
      # cache, so authentication happens once. One volume rather than one per harness:
      # the read-only root filesystem already requires the home to be a volume. The
      # directories of the harnesses' logs in it are not of the volume: container/sandbox.sh
      # mounts each, as the harness's module names it, from the project's log directory on
      # the host. So the harnesses' sessions are not in the volume, and neither is a login
      # that a harness keeps in such a directory, as OpenCode keeps its own.
      - agent-home:/home/agent
      # The developer's git identity, read-only, so commits from inside carry the same
      # name and email as on the host. Mounted as the system git config, the lowest
      # precedence, so the agent's own ~/.gitconfig stays writable. It is the only
      # host dotfile this file mounts. container/sandbox.sh adds what a harness's module
      # takes from the host, such as Claude Code's status line script when the host has
      # one, and in every run the log directories named above, read-write.
      - ${HOME}/.gitconfig:/etc/gitconfig:ro

volumes:
  agent-home:
